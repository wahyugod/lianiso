<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KING DWIKI</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Tagesschrift&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>KING DWIKI</h1>
    <div class="photo">
      <img id="mainImage" src="assets/dwiki.png" alt="Dwiki" />
    </div>
    <div class="toggle">
      <input type="checkbox" id="modeToggle" />
      <label for="modeToggle">
        <img src="assets/day.png" class="icon" alt="Siang" />
        <img src="assets/night.png" class="icon" alt="Malam" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="info-section">
      <div class="card kind">
        <div class="line"></div>
        <div class="content">
          <img src="assets/dwiki.png" alt="Kind Dwiki" />
          <div class="text">
            <h2>KIND DWIKI</h2>
            <p>
              Anomali ini tergolong ramah dan putih, dia biasanya bermain game
              dan pergi ke gym agar badannya berotot
            </p>
          </div>
        </div>
        <div class="line"></div>
      </div>

      <div class="card evil">
        <div class="line"></div>
        <div class="content">
          <div class="text">
            <h2>EVIL DWIKI</h2>
            <p>
              Anomali ini tergolong berbahaya dan hitam, dia bisa menghabiskan
              20 kotak surya dalam sehari, hati-hati jika bertemu dia
            </p>
          </div>
          <img src="assets/evil_dwiki.png" alt="Evil Dwiki" />
        </div>
        <div class="line"></div>
      </div>
    </div>

    <!-- Partner/Logo Grid -->
    <footer class="logo-footer" aria-label="Partner logos">
      <!-- Added header above the eight logos -->
      <h3 id="logo-header">KOLEKSI DWIKI</h3>

      <div class="logo-grid">
        <a
          class="logo-item"
          href="ais.unmul.ac.id"
          target="_blank"
          aria-label="Logo 1 link"
        >
          <figure class="logo-figure">
            <img src="assets/logo1.png" alt="AIS" />
            <figcaption class="logo-caption">AIS UNMUL</figcaption>
          </figure>
        </a>
        <a
          class="logo-item"
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Logo 2 link"
        >
          <figure class="logo-figure">
            <img src="assets/logo2.png" alt="Logo 2" />
            <figcaption class="logo-caption">Logo 2</figcaption>
          </figure>
        </a>
        <a
          class="logo-item"
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Logo 3 link"
        >
          <figure class="logo-figure">
            <img src="assets/logo3.png" alt="Logo 3" />
            <figcaption class="logo-caption">Logo 3</figcaption>
          </figure>
        </a>
        <a
          class="logo-item"
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Logo 4 link"
        >
          <figure class="logo-figure">
            <img src="assets/logo4.png" alt="Logo 4" />
            <figcaption class="logo-caption">Logo 4</figcaption>
          </figure>
        </a>
        <a
          class="logo-item"
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Logo 5 link"
        >
          <figure class="logo-figure">
            <img src="assets/logo5.png" alt="Logo 5" />
            <figcaption class="logo-caption">Logo 5</figcaption>
          </figure>
        </a>
        <a
          class="logo-item"
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Logo 6 link"
        >
          <figure class="logo-figure">
            <img src="assets/logo6.png" alt="Logo 6" />
            <figcaption class="logo-caption">Logo 6</figcaption>
          </figure>
        </a>
        <a
          class="logo-item"
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Logo 7 link"
        >
          <figure class="logo-figure">
            <img src="assets/logo7.png" alt="Logo 7" />
            <figcaption class="logo-caption">Logo 7</figcaption>
          </figure>
        </a>
        <a
          class="logo-item"
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Logo 8 link"
        >
          <figure class="logo-figure">
            <img src="assets/logo8.png" alt="Logo 8" />
            <figcaption class="logo-caption">Logo 8</figcaption>
          </figure>
        </a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
